<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeting Notes | Engineering</title>
    <style>
        :root {
            --bg: #fafafa;
            --fg: #1a1a1a;
            --fg-secondary: #666;
            --border: #ccc;
            --border-light: #e5e5e5;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --success: #16a34a;
            --warning: #ca8a04;
            --danger: #dc2626;
            --card-bg: #fff;
            --highlight: #fef08a;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--fg);
            line-height: 1.5;
            font-size: 13px;
        }
        
        header {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .logo {
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        
        .search-container {
            flex: 0 1 500px;
            position: relative;
        }
        
        #searchInput {
            width: 100%;
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--border);
            font-size: 13px;
            outline: none;
            transition: border-color 0.15s;
        }
        
        #searchInput:focus {
            border-color: var(--accent);
        }
        
        #searchInput::placeholder {
            color: var(--fg-secondary);
        }
        
        .stats {
            font-size: 12px;
            color: var(--fg-secondary);
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.5rem;
        }
        
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.75rem;
        }
        
        .filter-group {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }
        
        .filter-select {
            padding: 0.375rem 0.75rem;
            border: 1px solid var(--border);
            font-size: 12px;
            background: var(--card-bg);
            cursor: pointer;
        }
        
        .btn {
            padding: 0.375rem 0.75rem;
            border: 1px solid var(--border);
            background: var(--card-bg);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
        }
        
        .btn:hover {
            background: var(--bg);
        }
        
        .btn.active {
            background: var(--fg);
            color: var(--card-bg);
            border-color: var(--fg);
        }
        
        .meeting-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            margin-bottom: 1rem;
        }
        
        .meeting-header {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            cursor: pointer;
            transition: background 0.15s;
        }
        
        .meeting-header:hover {
            background: #f8f8f8;
        }
        
        .meeting-title-section h2 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }
        
        .meeting-meta {
            font-size: 12px;
            color: var(--fg-secondary);
        }
        
        .meeting-meta span {
            margin-right: 1rem;
        }
        
        .expand-icon {
            font-size: 12px;
            color: var(--fg-secondary);
            transition: transform 0.2s;
        }
        
        .meeting-card.expanded .expand-icon {
            transform: rotate(180deg);
        }
        
        .meeting-body {
            display: none;
            padding: 1.25rem;
        }
        
        .meeting-card.expanded .meeting-body {
            display: block;
        }
        
        .two-column {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }
        
        @media (max-width: 768px) {
            .two-column {
                grid-template-columns: 1fr;
            }
        }
        
        .section {
            margin-bottom: 1.5rem;
        }
        
        .section:last-child {
            margin-bottom: 0;
        }
        
        .section-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--fg-secondary);
            margin-bottom: 0.5rem;
            padding-bottom: 0.25rem;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .summary-text {
            font-size: 13px;
            line-height: 1.6;
            color: var(--fg);
        }
        
        .transcription-box {
            background: #f5f5f5;
            border: 1px solid var(--border-light);
            padding: 1rem;
            font-size: 12px;
            line-height: 1.7;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .speaker {
            font-weight: 600;
            color: var(--accent);
        }
        
        .timestamp {
            color: var(--fg-secondary);
            font-size: 11px;
        }
        
        .attendee-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 0.5rem;
        }
        
        .attendee {
            font-size: 12px;
            padding: 0.375rem;
            background: var(--bg);
            border: 1px solid var(--border-light);
        }
        
        .attendee-name {
            font-weight: 600;
        }
        
        .attendee-role {
            font-size: 11px;
            color: var(--fg-secondary);
        }
        
        .agenda-list, .decision-list, .risk-list, .attachment-list {
            list-style: none;
        }
        
        .agenda-item, .decision-item, .risk-item, .attachment-item {
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--border-light);
            font-size: 13px;
        }
        
        .agenda-item:last-child, .decision-item:last-child, .risk-item:last-child, .attachment-item:last-child {
            border-bottom: none;
        }
        
        .agenda-status {
            font-size: 10px;
            padding: 0.125rem 0.375rem;
            margin-left: 0.5rem;
            text-transform: uppercase;
            font-weight: 600;
        }
        
        .agenda-status.discussed {
            background: #dcfce7;
            color: var(--success);
        }
        
        .agenda-status.pending {
            background: #fef3c7;
            color: var(--warning);
        }
        
        .agenda-status.cancelled {
            background: #fee2e2;
            color: var(--danger);
        }
        
        .decision-item {
            display: flex;
            gap: 0.75rem;
        }
        
        .decision-marker {
            color: var(--accent);
            font-weight: 700;
            flex-shrink: 0;
        }
        
        .risk-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        
        .risk-level {
            font-size: 10px;
            padding: 0.125rem 0.375rem;
            text-transform: uppercase;
            font-weight: 600;
            flex-shrink: 0;
            margin-left: 0.5rem;
        }
        
        .risk-high {
            background: #fee2e2;
            color: var(--danger);
        }
        
        .risk-medium {
            background: #fef3c7;
            color: var(--warning);
        }
        
        .risk-low {
            background: #dbeafe;
            color: var(--accent);
        }
        
        .attachment-item a {
            color: var(--accent);
            text-decoration: none;
        }
        
        .attachment-item a:hover {
            text-decoration: underline;
        }
        
        .attachment-type {
            font-size: 10px;
            color: var(--fg-secondary);
            margin-left: 0.5rem;
            text-transform: uppercase;
        }
        
        .next-meeting {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            padding: 0.75rem;
            font-size: 12px;
        }
        
        .next-meeting-label {
            font-weight: 600;
            color: var(--success);
            font-size: 11px;
            text-transform: uppercase;
            margin-bottom: 0.25rem;
        }
        
        .action-list {
            list-style: none;
        }
        
        .action-item {
            display: flex;
            align-items: flex-start;
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--border-light);
        }
        
        .action-item:last-child {
            border-bottom: none;
        }
        
        .action-checkbox {
            margin-right: 0.75rem;
            margin-top: 0.125rem;
            width: 14px;
            height: 14px;
            cursor: pointer;
        }
        
        .action-text {
            flex: 1;
            font-size: 13px;
        }
        
        .action-item.completed .action-text {
            text-decoration: line-through;
            color: var(--fg-secondary);
        }
        
        .action-assignee {
            font-size: 11px;
            color: var(--accent);
            background: #eff6ff;
            padding: 0.125rem 0.5rem;
            margin-left: 0.5rem;
            white-space: nowrap;
        }
        
        .action-due {
            font-size: 11px;
            color: var(--fg-secondary);
            margin-left: 0.5rem;
            white-space: nowrap;
        }
        
        .action-due.overdue {
            color: var(--danger);
            font-weight: 600;
        }
        
        .action-priority {
            font-size: 10px;
            padding: 0.125rem 0.375rem;
            margin-left: 0.5rem;
            text-transform: uppercase;
            font-weight: 600;
        }
        
        .priority-high {
            background: #fee2e2;
            color: var(--danger);
        }
        
        .priority-medium {
            background: #fef3c7;
            color: var(--warning);
        }
        
        .priority-low {
            background: #dbeafe;
            color: var(--accent);
        }
        
        .no-results {
            text-align: center;
            padding: 3rem;
            color: var(--fg-secondary);
            font-size: 14px;
        }
        
        .highlight {
            background: var(--highlight);
            padding: 0 2px;
        }
        
        .progress-bar {
            height: 3px;
            background: var(--border-light);
            margin-top: 0.25rem;
        }
        
        .progress-fill {
            height: 100%;
            background: var(--success);
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Meeting Notes</div>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search meetings, summaries, transcriptions, decisions...">
        </div>
        <div class="stats">
            <span id="statsCount">Loading meetings...</span>
            <button class="btn" onclick="exportMeetings()">Export</button>
        </div>
    </header>
    
    <main>
        <div class="controls">
            <div class="filter-group">
                <select class="filter-select" id="sortSelect" onchange="applyFilters()">
                    <option value="date-desc">Date: Newest First</option>
                    <option value="date-asc">Date: Oldest First</option>
                    <option value="title-asc">Title: A-Z</option>
                    <option value="actions">Most Action Items</option>
                </select>
                <button class="btn" id="pendingBtn" onclick="togglePendingFilter()">Pending Only</button>
                <button class="btn" onclick="expandAll()">Expand All</button>
                <button class="btn" onclick="collapseAll()">Collapse All</button>
            </div>
        </div>
        
        <div id="meetingsContainer"></div>
    </main>

    <script>
        const DEFAULT_MEETING_FILES = [
            'data/meetings/01-q1-engineering-planning.json',
            'data/meetings/02-api-design-review-payments.json',
            'data/meetings/03-incident-review-database-outage.json',
            'data/meetings/04-security-audit-prep.json',
            'data/meetings/05-mobile-app-performance-review.json',
            'data/meetings/06-vendor-evaluation-monitoring-tools.json',
            'data/meetings/07-frontend-architecture-component-library.json',
            'data/meetings/08-customer-success-q4-retrospective.json'
        ];
        const INDEX_FILE = 'data/meetings/index.json';
        let meetings = [];

        function normalizeMeetingFilePath(fileEntry) {
            const raw = String(fileEntry || '').trim();
            if (!raw) return null;
            if (raw.startsWith('data/meetings/')) return raw;
            if (!raw.endsWith('.json')) return null;
            return `data/meetings/${raw.replace(/^\.?\/*/, '')}`;
        }

        async function resolveMeetingFiles() {
            try {
                const response = await fetch(INDEX_FILE, { cache: 'no-store' });
                if (!response.ok) return DEFAULT_MEETING_FILES;

                const data = await response.json();
                const entries = Array.isArray(data) ? data : (Array.isArray(data?.files) ? data.files : []);
                if (!Array.isArray(entries) || entries.length === 0) return DEFAULT_MEETING_FILES;

                const normalized = entries
                    .map(normalizeMeetingFilePath)
                    .filter(Boolean);

                return normalized.length > 0 ? normalized : DEFAULT_MEETING_FILES;
            } catch {
                return DEFAULT_MEETING_FILES;
            }
        }

        async function loadMeetings(files = DEFAULT_MEETING_FILES) {
            const loaded = [];
            for (const file of files) {
                const response = await fetch(file, { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error(`Unable to load meeting from "${file}" (HTTP ${response.status})`);
                }

                const data = await response.json();
                if (Array.isArray(data) || typeof data !== 'object' || data === null) {
                    throw new Error(`Meeting JSON must be a single object in "${file}".`);
                }

                loaded.push(data);
            }

            meetings = loaded;
        }

        function renderFileModeLoader(message = '') {
            stats.textContent = '0 meetings';
            container.innerHTML = `
                <div class="no-results">
                    ${message || 'This page is running in local file mode (file://), so the browser blocks JSON fetch requests.'}<br><br>
                    Select one or more meeting JSON files to load.<br>
                    <input id="jsonFileInput" type="file" accept=".json,application/json" multiple style="margin-top: 10px;">
                    <div style="margin-top: 10px; font-size: 12px; color: #7f8c8d;">
                        Tip: you can also run a local server and open this page over http://.
                    </div>
                </div>
            `;

            const input = document.getElementById('jsonFileInput');
            if (input) {
                input.addEventListener('change', handleJsonFileSelection);
            }
        }

        async function handleJsonFileSelection(event) {
            const files = Array.from((event.target.files || [])).filter(file => file.name.toLowerCase().endsWith('.json'));
            if (files.length === 0) return;

            try {
                const loaded = [];
                for (const file of files) {
                    const text = await file.text();
                    const data = JSON.parse(text);
                    if (Array.isArray(data) || typeof data !== 'object' || data === null) {
                        throw new Error(`Meeting JSON must be a single object in "${file.name}".`);
                    }
                    loaded.push(data);
                }

                meetings = loaded;
                loadCompletedStates();
                applyFilters();
            } catch (error) {
                renderFileModeLoader(`Failed to load selected files: ${error.message}`);
            }
        }

        function renderLoadError(message) {
            container.innerHTML = `<div class="no-results">Failed to load meetings: ${message}</div>`;
            stats.textContent = '0 meetings';
        }

        let pendingOnly = false;

        const container = document.getElementById('meetingsContainer');
        const searchInput = document.getElementById('searchInput');
        const stats = document.getElementById('statsCount');

        // Load completed states from localStorage
        function loadCompletedStates() {
            const saved = localStorage.getItem('meetingNotesCompleted');
            if (saved) {
                const states = JSON.parse(saved);
                meetings.forEach(meeting => {
                    meeting.actions.forEach(action => {
                        const key = `${meeting.id}-${action.text}`;
                        if (states[key] !== undefined) {
                            action.completed = states[key];
                        }
                    });
                });
            }
        }

        // Save completed states to localStorage
        function saveCompletedStates() {
            const states = {};
            meetings.forEach(meeting => {
                meeting.actions.forEach(action => {
                    const key = `${meeting.id}-${action.text}`;
                    states[key] = action.completed;
                });
            });
            localStorage.setItem('meetingNotesCompleted', JSON.stringify(states));
        }

        function togglePendingFilter() {
            pendingOnly = !pendingOnly;
            document.getElementById('pendingBtn').classList.toggle('active', pendingOnly);
            applyFilters();
        }

        function sortMeetings(meetingsToSort) {
            const sortType = document.getElementById('sortSelect').value;
            const sorted = [...meetingsToSort];
            
            switch(sortType) {
                case 'date-asc':
                    sorted.sort((a, b) => new Date(a.date) - new Date(b.date));
                    break;
                case 'date-desc':
                    sorted.sort((a, b) => new Date(b.date) - new Date(a.date));
                    break;
                case 'title-asc':
                    sorted.sort((a, b) => a.title.localeCompare(b.title));
                    break;
                case 'actions':
                    sorted.sort((a, b) => b.actions.length - a.actions.length);
                    break;
            }
            return sorted;
        }

        function applyFilters() {
            let filtered = meetings;
            
            if (pendingOnly) {
                filtered = filtered.filter(m => m.actions.some(a => !a.completed));
            }
            
            const searchTerm = searchInput.value.toLowerCase();
            if (searchTerm) {
                filtered = filtered.filter(meeting => 
                    meeting.title.toLowerCase().includes(searchTerm) ||
                    meeting.summary.toLowerCase().includes(searchTerm) ||
                    meeting.transcription.toLowerCase().includes(searchTerm) ||
                    meeting.decisions.some(d => d.toLowerCase().includes(searchTerm)) ||
                    meeting.actions.some(action => 
                        action.text.toLowerCase().includes(searchTerm) ||
                        action.assignee.toLowerCase().includes(searchTerm)
                    ) ||
                    meeting.attendees.some(a => 
                        a.name.toLowerCase().includes(searchTerm) ||
                        a.role.toLowerCase().includes(searchTerm)
                    )
                );
            }
            
            filtered = sortMeetings(filtered);
            renderMeetings(filtered, searchTerm);
        }

        function renderMeetings(meetingsToRender, searchTerm = '') {
            if (meetingsToRender.length === 0) {
                container.innerHTML = '<div class="no-results">No meetings found matching your search.</div>';
                stats.textContent = '0 meetings';
                return;
            }

            container.innerHTML = meetingsToRender.map(meeting => {
                const completedActions = meeting.actions.filter(a => a.completed).length;
                const progress = meeting.actions.length > 0 ? (completedActions / meeting.actions.length) * 100 : 0;
                
                return `
                <div class="meeting-card" data-id="${meeting.id}">
                    <div class="meeting-header" onclick="toggleMeeting(${meeting.id})">
                        <div class="meeting-title-section">
                            <h2>${highlightText(meeting.title, searchTerm)}</h2>
                            <div class="meeting-meta">
                                <span>${formatDate(meeting.date)}</span>
                                <span>${meeting.duration}</span>
                                <span>${meeting.attendees.length} participant${meeting.attendees.length !== 1 ? 's' : ''}</span>
                            </div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${progress}%"></div>
                            </div>
                        </div>
                        <span class="expand-icon">▼</span>
                    </div>
                    <div class="meeting-body">
                        <div class="two-column">
                            <div class="section">
                                <div class="section-label">Attendees</div>
                                <div class="attendee-list">
                                    ${meeting.attendees.map(a => `
                                        <div class="attendee">
                                            <div class="attendee-name">${highlightText(a.name, searchTerm)}</div>
                                            <div class="attendee-role">${a.role}</div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                            
                            <div class="section">
                                <div class="section-label">Agenda</div>
                                <ul class="agenda-list">
                                    ${meeting.agenda.map(item => `
                                        <li class="agenda-item">
                                            ${highlightText(item.item, searchTerm)}
                                            <span class="agenda-status ${item.status}">${item.status}</span>
                                        </li>
                                    `).join('')}
                                </ul>
                            </div>
                        </div>
                        
                        <div class="section">
                            <div class="section-label">Summary</div>
                            <div class="summary-text">${highlightText(meeting.summary, searchTerm)}</div>
                        </div>
                        
                        <div class="section">
                            <div class="section-label">Key Decisions</div>
                            <ul class="decision-list">
                                ${meeting.decisions.map(d => `
                                    <li class="decision-item">
                                        <span class="decision-marker">►</span>
                                        <span>${highlightText(d, searchTerm)}</span>
                                    </li>
                                `).join('')}
                            </ul>
                        </div>
                        
                        <div class="section">
                            <div class="section-label">Transcription</div>
                            <div class="transcription-box">${highlightText(meeting.transcription, searchTerm)}</div>
                        </div>
                        
                        <div class="two-column">
                            <div class="section">
                                <div class="section-label">Action Items (${completedActions}/${meeting.actions.length})</div>
                                <ul class="action-list">
                                    ${meeting.actions.map(action => `
                                        <li class="action-item ${action.completed ? 'completed' : ''}">
                                            <input type="checkbox" class="action-checkbox" 
                                                   ${action.completed ? 'checked' : ''} 
                                                   onchange="toggleAction(${meeting.id}, '${action.text}')">
                                            <span class="action-text">${highlightText(action.text, searchTerm)}</span>
                                            <span class="action-assignee">${action.assignee}</span>
                                            <span class="action-due ${isOverdue(action.due) && !action.completed ? 'overdue' : ''}">${formatDate(action.due)}</span>
                                            <span class="action-priority priority-${action.priority}">${action.priority}</span>
                                        </li>
                                    `).join('')}
                                </ul>
                            </div>
                            
                            <div class="section">
                                <div class="section-label">Risks & Issues</div>
                                <ul class="risk-list">
                                    ${meeting.risks.map(risk => `
                                        <li class="risk-item">
                                            <span>${highlightText(risk.description, searchTerm)}</span>
                                            <span class="risk-level risk-${risk.level}">${risk.level}</span>
                                        </li>
                                    `).join('')}
                                </ul>
                            </div>
                        </div>
                        
                        <div class="two-column">
                            <div class="section">
                                <div class="section-label">Attachments</div>
                                <ul class="attachment-list">
                                    ${meeting.attachments.map(att => `
                                        <li class="attachment-item">
                                            <a href="${att.url}" onclick="event.preventDefault(); alert('Opening: ${att.name}')">${att.name}</a>
                                            <span class="attachment-type">${att.type}</span>
                                        </li>
                                    `).join('')}
                                </ul>
                            </div>
                            
                            <div class="section">
                                <div class="section-label">Next Meeting</div>
                                <div class="next-meeting">
                                    <div class="next-meeting-label">Scheduled</div>
                                    <strong>${meeting.nextMeeting.title}</strong><br>
                                    ${formatDate(meeting.nextMeeting.date)} at ${meeting.nextMeeting.time}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `}).join('');

            stats.textContent = `${meetingsToRender.length} meeting${meetingsToRender.length !== 1 ? 's' : ''}`;
        }

        function highlightText(text, searchTerm) {
            if (!searchTerm) return text;
            const regex = new RegExp(`(${escapeRegex(searchTerm)})`, 'gi');
            return text.replace(regex, '<span class="highlight">$1</span>');
        }

        function escapeRegex(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function isOverdue(dateStr) {
            return new Date(dateStr) < new Date();
        }

        function toggleMeeting(id) {
            const card = document.querySelector(`[data-id="${id}"]`);
            card.classList.toggle('expanded');
        }

        function expandAll() {
            document.querySelectorAll('.meeting-card').forEach(card => card.classList.add('expanded'));
        }

        function collapseAll() {
            document.querySelectorAll('.meeting-card').forEach(card => card.classList.remove('expanded'));
        }

        function toggleAction(meetingId, actionText) {
            const meeting = meetings.find(m => m.id === meetingId);
            const action = meeting.actions.find(a => a.text === actionText);
            if (action) {
                action.completed = !action.completed;
                saveCompletedStates();
                applyFilters();
                // Re-expand the card
                setTimeout(() => {
                    document.querySelector(`[data-id="${meetingId}"]`).classList.add('expanded');
                }, 0);
            }
        }

        function exportMeetings() {
            let exportText = "MEETING NOTES EXPORT\n";
            exportText += "=" .repeat(50) + "\n\n";
            
            meetings.forEach(meeting => {
                exportText += `## ${meeting.title}\n`;
                exportText += `Date: ${meeting.date} | Duration: ${meeting.duration}\n`;
                exportText += `Attendees: ${meeting.attendees.map(a => `${a.name} (${a.role})`).join(', ')}\n\n`;
                
                exportText += "### Summary\n";
                exportText += `${meeting.summary}\n\n`;
                
                exportText += "### Decisions\n";
                meeting.decisions.forEach(d => exportText += `- ${d}\n`);
                exportText += "\n";
                
                exportText += "### Action Items\n";
                meeting.actions.forEach(a => {
                    const status = a.completed ? '[x]' : '[ ]';
                    exportText += `${status} ${a.text} (${a.assignee}, due: ${a.due}, ${a.priority})\n`;
                });
                exportText += "\n";
                
                exportText += "### Risks\n";
                meeting.risks.forEach(r => exportText += `- [${r.level.toUpperCase()}] ${r.description}\n`);
                exportText += "\n";
                
                exportText += "---\n\n";
            });
            
            const blob = new Blob([exportText], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `meeting-notes-${new Date().toISOString().split('T')[0]}.md`;
            a.click();
            URL.revokeObjectURL(url);
        }

        searchInput.addEventListener('input', applyFilters);

        // Initialize
        async function initialize() {
            if (window.location.protocol === 'file:') {
                renderFileModeLoader();
                return;
            }

            try {
                const files = await resolveMeetingFiles();
                await loadMeetings(files);
                loadCompletedStates();
                applyFilters();
            } catch (error) {
                console.error(error);
                renderLoadError(error.message);
            }
        }

        initialize();
    </script>
</body>
</html>
