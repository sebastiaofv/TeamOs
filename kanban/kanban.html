            return safeText.replace(regex, '<span class="search-highlight">$1</span>');
        }

        function openModal(taskId = null, preferredStatus = null) {
            document.getElementById('taskModal').classList.add('active');
            document.getElementById('taskForm').reset();
            document.getElementById('taskId').value = '';
            document.getElementById('modalTitle').textContent = 'New Task';
            document.getElementById('taskDueDate').value = '';
            document.getElementById('taskTags').value = '';
            pendingNewTaskStatus = preferredStatus && columns.some(col => col.status === preferredStatus)
                ? preferredStatus
                : columns[0].status;

            if (taskId) {
                const task = tasks.find(t => t.id === taskId);
                if (task) {
                    document.getElementById('taskId').value = task.id;
                    document.getElementById('taskName').value = task.title;
                    document.getElementById('taskDescription').value = task.description || '';
                    document.getElementById('taskChecklist').value = checklistToInput(task.checklist || []);
                    document.getElementById('taskDueDate').value = normalizeDueDate(task.dueDate);
                    document.getElementById('taskTags').value = tagsToInput(task.tags);
                    document.getElementById('taskPriority').value = task.priority;
                    document.getElementById('modalTitle').textContent = 'Edit Task';
                    pendingNewTaskStatus = null;
                }
            }
        }

        function closeModal() {
            document.getElementById('taskModal').classList.remove('active');
            pendingNewTaskStatus = null;
        }

        function openTaskDetails(id) {
            const task = tasks.find(t => t.id === id);
            if (!task) return;
            selectedTaskId = id;

            const statusTitle = (columns.find(col => col.status === task.status) || {}).title || task.status;
            document.getElementById('detailTitle').textContent = task.title || '-';
            document.getElementById('detailDescription').textContent = task.description || '-';
            document.getElementById('detailPriority').textContent = task.priority ? (task.priority.charAt(0).toUpperCase() + task.priority.slice(1)) : '-';
            document.getElementById('detailStatus').textContent = statusTitle || '-';
            document.getElementById('detailCreatedAt').textContent = formatDateTime(task.createdAt);
            document.getElementById('detailUpdatedAt').textContent = formatDateTime(task.updatedAt);
            document.getElementById('detailDueDate').textContent = normalizeDueDate(task.dueDate) || '-';
            document.getElementById('detailTags').textContent = normalizeTags(task.tags).length ? normalizeTags(task.tags).map(tag => `#${tag}`).join(', ') : '-';
            renderDetailChecklist(task);
            document.getElementById('taskDetailModal').classList.add('active');
            renderTasks();
        }

        function renderDetailChecklist(task) {
            const list = document.getElementById('detailChecklist');
            const checklist = normalizeChecklist(task.checklist);

            if (checklist.length === 0) {
                list.innerHTML = '<li class="detail-value">-</li>';
                return;
            }

            list.innerHTML = checklist.map((item, index) => `
                <li class="detail-checklist-item ${item.done ? 'done' : ''}">
                    <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleChecklistItem(${task.id}, ${index}, this.checked)">
                    <span class="detail-checklist-text">${escapeHtml(item.text)}</span>
                </li>
            `).join('');
        }

        function toggleChecklistItem(taskId, itemIndex, checked) {
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;
            if (!Array.isArray(task.checklist) || !task.checklist[itemIndex]) return;

            task.checklist[itemIndex].done = checked;
            touchTask(task);
            saveTasks();
            renderTasks();
            openTaskDetails(taskId);
        }

        function closeDetailModal() {
            document.getElementById('taskDetailModal').classList.remove('active');
        }

        function saveTask() {
            const id = document.getElementById('taskId').value;
            const title = document.getElementById('taskName').value.trim();
            const description = document.getElementById('taskDescription').value.trim();
            const checklist = parseChecklistInput(document.getElementById('taskChecklist').value);
            const dueDate = normalizeDueDate(document.getElementById('taskDueDate').value);
            const tags = parseTagsInput(document.getElementById('taskTags').value);
            const priority = document.getElementById('taskPriority').value;

            if (!title) return;

            if (id) {
                const task = tasks.find(t => t.id === parseInt(id));
                if (task) {
                    task.title = title;
                    task.description = description;
                    task.checklist = checklist;
                    task.dueDate = dueDate;
                    task.tags = tags;
                    task.priority = priority;
                    touchTask(task);
                    selectedTaskId = task.id;
                }
            } else {
                const now = nowIso();
                const newTask = {
                    id: Date.now(),
                    title,
                    description,
                    checklist,
                    archived: false,
                    createdAt: now,
                    updatedAt: now,
                    dueDate,
                    tags,
                    priority,
                    status: pendingNewTaskStatus || columns[0].status
                };
                tasks.push(newTask);
                selectedTaskId = newTask.id;
            }

            saveTasks();
            renderTasks();
            closeModal();
            pendingNewTaskStatus = null;
        }

        function editTask(id) {
            selectedTaskId = id;
            openModal(id);
        }

        function toggleArchiveTask(id) {
            const task = tasks.find(t => t.id === id);
            if (!task) return;

            const wasArchived = task.archived;
            task.archived = !task.archived;
            touchTask(task);
            saveTasks();
            renderTasks();

            if (!wasArchived && task.archived) {
                showUndo('Task archived', () => {
                    const target = tasks.find(t => t.id === id);
                    if (!target) return;
                    target.archived = false;
                    touchTask(target);
                    saveTasks();
                    renderTasks();
                });
            }
        }

        function clearAllTasks() {
            if (confirm('Clear all tasks?')) {
                tasks = [];
                selectedTaskId = null;
                saveTasks();
                renderTasks();
            }
        }

        function addColumn() {
            if (columns.length >= MAX_COLUMNS) {
                alert(`Maximum of ${MAX_COLUMNS} columns allowed.`);
                return;
            }

            const name = prompt('Column name:');
            if (!name || !name.trim()) return;

            let baseStatus = slugifyColumnName(name);
            if (!baseStatus) {
                baseStatus = 'column';
            }

            let status = baseStatus;
            let suffix = 1;
            const existing = new Set(columns.map(col => col.status));
            while (existing.has(status)) {
                status = `${baseStatus}-${suffix}`;
                suffix++;
            }

            columns.push({ status, title: name.trim() });
            saveColumns();
            renderBoard();
            renderTasks();
        }

        function renameColumn(status) {
            const column = columns.find(col => col.status === status);
            if (!column) return;

            const nextTitle = prompt('Column name:', column.title);
            if (!nextTitle) return;
            const trimmed = nextTitle.trim();
            if (!trimmed || trimmed === column.title) return;

            column.title = trimmed;
            saveColumns();
            renderBoard();
            renderTasks();
        }

        function columnDragStart(ev, status) {
            draggedColumnStatus = status;
            ev.dataTransfer.setData('text/plain', status);
            ev.dataTransfer.effectAllowed = 'move';
        }

        function columnDragOver(ev) {
            ev.preventDefault();
        }

        function columnDrop(ev, targetStatus) {
            ev.preventDefault();
            const sourceStatus = draggedColumnStatus || ev.dataTransfer.getData('text/plain');
            draggedColumnStatus = null;
            if (!sourceStatus || sourceStatus === targetStatus) return;

            const sourceIndex = columns.findIndex(col => col.status === sourceStatus);
            const targetIndex = columns.findIndex(col => col.status === targetStatus);
            if (sourceIndex < 0 || targetIndex < 0) return;

            const [moved] = columns.splice(sourceIndex, 1);
            columns.splice(targetIndex, 0, moved);
            saveColumns();
            renderBoard();
            renderTasks();
        }

        function deleteColumn(status) {
            if (columns.length === 1) {
                alert('At least one column is required.');
                return;
            }

            const column = columns.find(col => col.status === status);
            if (!column) return;

            const fallback = columns.find(col => col.status !== status);
            if (!fallback) return;

            const affectedTasks = tasks.filter(task => task.status === status).length;
            const message = affectedTasks > 0
                ? `Delete "${column.title}" and move ${affectedTasks} task(s) to "${fallback.title}"?`
                : `Delete "${column.title}"?`;

            if (!confirm(message)) return;

            tasks.forEach(task => {
                if (task.status === status) {
                    task.status = fallback.status;
                }
            });

            columns = columns.filter(col => col.status !== status);
            saveTasks();
            saveColumns();
            renderBoard();
            renderTasks();
        }

        function filterTasks() {
            renderTasks();
            updateUrlState();
        }

        function drag(ev) {
            ev.dataTransfer.setData('text', ev.target.dataset.id);
            ev.target.classList.add('dragging');
        }

        function allowDrop(ev) {
            ev.preventDefault();
        }

        function dragEnter(ev) {
            ev.preventDefault();
            if (ev.target.classList.contains('column-body')) {
                ev.target.classList.add('drag-over');
            }
        }

        function dragLeave(ev) {
            if (ev.target.classList.contains('column-body')) {
                ev.target.classList.remove('drag-over');
            }
        }

        function drop(ev, status) {
            ev.preventDefault();
            const id = parseInt(ev.dataTransfer.getData('text'));
            const task = tasks.find(t => t.id === id);
            
            if (task) {
                const previousStatus = task.status;
                task.status = status;
                selectedTaskId = task.id;
                touchTask(task);
                saveTasks();
                renderTasks();
                if (previousStatus !== status) {
                    showUndo('Task moved', () => {
                        const target = tasks.find(t => t.id === id);
                        if (!target) return;
                        target.status = previousStatus;
                        touchTask(target);
                        saveTasks();
                        renderTasks();
                    });
                }
            }

            document.querySelectorAll('.column-body').forEach(col => {
                col.classList.remove('drag-over');
            });
            document.querySelectorAll('.task-card').forEach(card => {
                card.classList.remove('dragging');
            });
        }

        document.getElementById('taskModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('taskModal')) {
                closeModal();
            }
        });

        document.getElementById('taskDetailModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('taskDetailModal')) {
                closeDetailModal();
            }
        });

        document.addEventListener('keydown', (e) => {
            const activeTag = document.activeElement ? document.activeElement.tagName : '';
            const isTyping = activeTag === 'INPUT' || activeTag === 'TEXTAREA' || activeTag === 'SELECT';
            const modalOpen = document.getElementById('taskModal').classList.contains('active') || document.getElementById('taskDetailModal').classList.contains('active');

            if (!isTyping && !modalOpen && e.key === '/') {
                e.preventDefault();
                if (appMode === 'portfolio') {
                    document.getElementById('portfolioSearchInput').focus();
                } else {
                    document.getElementById('searchInput').focus();
                }
                return;
            }

            if (appMode === 'board' && !isTyping && !modalOpen && (e.key === 'n' || e.key === 'N')) {
                e.preventDefault();
                openModal();
                return;
            }

            if (appMode === 'board' && !isTyping && !modalOpen && (e.key === 'e' || e.key === 'E')) {
                if (selectedTaskId) {
                    e.preventDefault();
                    editTask(selectedTaskId);
                }
                return;
            }

            if (e.key === 'Escape') {
                closeModal();
                closeDetailModal();
            }
        });

        window.addEventListener('popstate', () => {
            applyUrlState();
            if (appMode === 'board') {
                renderTasks();
            } else {
                renderPortfolio();
            }
        });

        init();
    </script>
</body>
</html>
