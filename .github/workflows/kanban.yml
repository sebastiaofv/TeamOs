# TeamOS Kanban: test every change, and publish the built app from main.
#
# - Pull requests and pushes touching kanban/: lint, typecheck, unit tests and
#   Playwright end-to-end tests. Visual snapshot tests are skipped here: their
#   baselines are recorded on macOS and differ pixel-for-pixel on Linux, so run
#   them locally with `npm test`.
# - Pushes to main (and manual runs on main): the build the tests ran against
#   is handed to the release job, which updates the "kanban-latest" GitHub
#   Release in place with the standalone HTML file and a zip of dist/.

name: Kanban CI

on:
  push:
    branches: [main]
    paths:
      - 'kanban/**'
      - '.github/workflows/kanban.yml'
  pull_request:
    paths:
      - 'kanban/**'
      - '.github/workflows/kanban.yml'
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR runs are cancelled. Runs on main are queued instead, so a new
# push never cancels a release that is halfway through.
concurrency:
  group: kanban-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: kanban

env:
  # The prepare script installs git hooks; they are not needed in CI.
  HUSKY: '0'

jobs:
  test:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: kanban/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit

      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Playwright's webServer builds dist/ and dist-standalone/ before the run.
      - name: End-to-end tests
        run: npx playwright test tests/e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            kanban/playwright-report/
            kanban/test-results/
          retention-days: 14

      # Hand the tested build to the release job instead of rebuilding there.
      - name: Upload tested build
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kanban-build
          path: |
            kanban/dist/
            kanban/dist-standalone/
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: kanban-release
      cancel-in-progress: false
    defaults:
      run:
        working-directory: .
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download tested build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kanban-build
          path: build

      - name: Package
        run: |
          mkdir -p release
          cp build/dist-standalone/index.html release/teamos-kanban.html
          (cd build/dist && zip -qr ../../release/teamos-kanban-dist.zip .)

      # Updated in place: the release and its download links never disappear,
      # even if this step fails partway.
      - name: Update the kanban-latest release
        run: |
          cat > notes.md <<EOF
          Built from ${GITHUB_SHA::7} on $(date -u +'%Y-%m-%d %H:%M UTC').

          - **teamos-kanban.html**: the whole app in one file. Download it and open it in a Chromium-based browser.
          - **teamos-kanban-dist.zip**: the regular build (\`dist/\`) for serving from a web server.
          EOF
          title="TeamOS Kanban (latest build)"

          if gh release view kanban-latest > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/kanban-latest" \
              -f sha="$GITHUB_SHA" -F force=true > /dev/null
            gh release upload kanban-latest release/* --clobber
            gh release edit kanban-latest --title "$title" --notes-file notes.md --latest
          else
            # First run, or a tag left without its release: start clean.
            gh api -X DELETE "repos/$GH_REPO/git/refs/tags/kanban-latest" > /dev/null 2>&1 || true
            gh release create kanban-latest release/* \
              --target "$GITHUB_SHA" --title "$title" --notes-file notes.md --latest
          fi

      - name: Keep the build as a workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: teamos-kanban-${{ github.sha }}
          path: release/
          retention-days: 90
